[project]
name = "rag-chatbot-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbhishekDB99", email = "abhishekborhade4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-chatbot-python = "rag_chatbot_python:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
